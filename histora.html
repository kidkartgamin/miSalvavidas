<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nosotros</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Karla:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--noche:#0e1b2c;--arena:#f1e6d2;--sal:#e5483f;--bruma:#9fb0c3;
  --serif:"Cormorant Garamond",Georgia,serif;--sans:"Karla",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--noche);color:var(--arena);font-family:var(--sans)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--sal);outline-offset:3px}

#escena{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#16283f,var(--noche) 75%)}
.foto{position:absolute;background:#f8f1e4;padding:5px 5px 14px;border-radius:2px;
  box-shadow:0 8px 24px #0008;will-change:transform}
.foto img{display:block;width:100%;height:100%;object-fit:cover}

/* Frases al centro */
#centro{position:fixed;inset:0;z-index:5;display:grid;place-items:center;pointer-events:none;text-align:center;padding:24px}
#centro::before{content:"";position:absolute;width:min(92vw,760px);height:min(46vh,340px);
  background:radial-gradient(ellipse,#0e1b2cf2 0,#0e1b2ccc 45%,transparent 72%)}
#frase{position:relative;font:italic 600 clamp(38px,8vw,92px)/1.08 var(--serif);max-width:12em;
  text-shadow:0 2px 24px #000a;opacity:0;transform:scale(.96);transition:opacity 1.2s ease,transform 1.2s ease}
#frase.on{opacity:1;transform:scale(1)}

/* Controles */
.barra{position:fixed;bottom:14px;z-index:20;display:flex;gap:10px;align-items:center}
#izq{left:14px}#der{right:14px}
.chip{background:#0e1b2ccc;backdrop-filter:blur(8px);border:1px solid #ffffff2a;border-radius:999px;padding:9px 18px;font-size:.9rem;transition:background .2s}
.chip:hover{background:#ffffff22}
.chip[aria-pressed=true]{background:var(--arena);color:var(--noche)}
#cancion small{color:var(--bruma);margin-left:6px}

/* Entrada */
#entrada{position:fixed;inset:0;z-index:50;display:grid;place-content:center;justify-items:center;gap:22px;text-align:center;
  background:var(--noche);padding:24px;transition:opacity .9s,visibility .9s}
#entrada.fuera{opacity:0;visibility:hidden}
#entrada h1{font:italic 600 clamp(44px,10vw,96px)/1 var(--serif)}
#entrada p{color:var(--bruma);max-width:34ch}
.btn{border:1px solid var(--arena);background:transparent;padding:12px 30px;border-radius:999px;transition:background .2s,color .2s}
.btn:hover{background:var(--arena);color:var(--noche)}
.btn.sol{background:var(--sal);border-color:var(--sal);color:#fff}
.btn.sol:hover{background:#fff;color:var(--sal)}
#aviso{position:fixed;top:50%;left:50%;transform:translate(-50%,120px);z-index:6;text-align:center;color:var(--bruma);display:none}
@media (prefers-reduced-motion:reduce){#frase{transition:none}}
</style>
</head>

<div id="escena"></div>
<div id="centro"><div id="frase"></div></div>
<p id="aviso">Aún no hay fotos. Toca “Elegir fotos” abajo.</p>

<div class="barra" id="izq">
  <button class="chip" id="m-lluvia" aria-pressed="true">Lluvia</button>
  <button class="chip" id="m-collage" aria-pressed="false">Collage</button>
  <button class="chip" id="btn-fotos">Elegir fotos</button>
</div>
<div class="barra" id="der">
  <button class="chip" id="cancion" aria-label="Pausar o reproducir">♪ Salvavidas<small>Aerophon · Juan Pablo Vega</small></button>
</div>

<section id="entrada">
  <h1 id="t-nombres"></h1>
  <p>Con volumen, por favor. Esta es para ti.</p>
  <button class="btn sol" id="entrar">Entrar</button>
</section>

<input type="file" id="in-fotos" accept="image/*" multiple hidden>
<input type="file" id="in-audio" accept="audio/*" hidden>

<script>
const $ = id => document.getElementById(id);
const escena = $("escena");
let fotos = [...CONFIG.fotos];
let modo = matchMedia("(prefers-reduced-motion:reduce)").matches ? "collage" : "lluvia";
let timers = [];
const movil = () => innerWidth < 640;

$("t-nombres").textContent = CONFIG.nombres;
document.title = CONFIG.nombres;

/* ---------- utilidades ---------- */
const rnd = (a,b) => a + Math.random()*(b-a);
function mezclar(a){ a = [...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
let cola = [];
const siguiente = () => { if(!cola.length) cola = mezclar(fotos); return cola.pop(); };
function crearFoto(src, w){
  const f = document.createElement("div");
  f.className = "foto";
  f.style.width = w + "px"; f.style.height = (w*1.2) + "px";
  const im = document.createElement("img"); im.src = src; im.alt = "";
  f.appendChild(im); return f;
}
function limpiar(){
  timers.forEach(t => { clearInterval(t); clearTimeout(t); });
  timers = []; escena.innerHTML = "";
}

/* ---------- LLUVIA ---------- */
function lluvia(){
  const caer = () => {
    const w = movil() ? rnd(80,130) : rnd(120,210);
    const f = crearFoto(siguiente(), w);
    f.style.left = rnd(-2, 94) + "vw";
    f.style.top = "0px";
    escena.appendChild(f);
    const r = rnd(-14,14), dx = rnd(-60,60);
    const dur = rnd(9000,16000) * (w < 140 ? 1.15 : 0.9);
    f.animate([
      {transform:`translate(0,-${w*1.4}px) rotate(${r}deg)`},
      {transform:`translate(${dx}px,${innerHeight + 60}px) rotate(${r + rnd(-10,10)}deg)`}
    ],{duration:dur,easing:"linear"}).onfinish = () => f.remove();
  };
  for(let i=0;i<7;i++){ const t=setTimeout(caer, i*350); timers.push(t); }
  timers.push(setInterval(caer, movil() ? 1000 : 700));
}

/* ---------- COLLAGE ---------- */
function collage(){
  const W = innerWidth, H = innerHeight;
  const minLado = movil() ? 80 : 110;
  const lado = Math.max(minLado, Math.sqrt(W*H / Math.min(fotos.length, 40)) * 0.92);
  const cols = Math.max(2, Math.floor(W/lado)), rows = Math.max(2, Math.floor(H/(lado*1.15)));
  const cw = W/cols, ch = H/rows, ancho = cw*1.1;
  const celdas = [];
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const cx = (c+.5)/cols - .5, cy = (r+.5)/rows - .5;
    if((cx*cx)/.045 + (cy*cy)/.03 < 1) continue; // deja libre el centro para las frases
    celdas.push({c,r});
  }
  mezclar(celdas).slice(0, fotos.length).forEach((cel,i) => {
    const f = crearFoto(siguiente(), ancho);
    f.style.left = (cel.c*cw + rnd(-8,8) - ancho*.05) + "px";
    f.style.top  = (cel.r*ch + rnd(-8,8)) + "px";
    f.style.transform = `rotate(${rnd(-9,9)}deg) scale(0)`;
    f.style.transition = "transform .7s cubic-bezier(.2,1.4,.4,1)";
    f.dataset.rot = f.style.transform.match(/rotate\(([^)]+)\)/)[1];
    escena.appendChild(f);
    timers.push(setTimeout(() => f.style.transform = `rotate(${f.dataset.rot}) scale(1)`, 120 + i*110));
  });
  // Cambia fotos poco a poco para que salgan todas
  if(fotos.length > celdas.length){
    timers.push(setInterval(() => {
      const els = escena.querySelectorAll(".foto img"); if(!els.length) return;
      els[Math.floor(Math.random()*els.length)].src = siguiente();
    }, 2500));
  }
}

function iniciar(){
  limpiar();
  $("aviso").style.display = fotos.length ? "none" : "block";
  if(!fotos.length) return;
  cola = mezclar(fotos);
  modo === "lluvia" ? lluvia() : collage();
}

/* ---------- Frases ---------- */
let k = 0;
function frase(){
  const el = $("frase");
  el.classList.remove("on");
  setTimeout(() => {
    el.textContent = CONFIG.frases[k++ % CONFIG.frases.length];
    el.classList.add("on");
  }, 1200);
}
frase(); setInterval(frase, 5200);

/* ---------- Controles ---------- */
function setModo(m){
  modo = m;
  $("m-lluvia").setAttribute("aria-pressed", m==="lluvia");
  $("m-collage").setAttribute("aria-pressed", m==="collage");
  iniciar();
}
$("m-lluvia").onclick = () => setModo("lluvia");
$("m-collage").onclick = () => setModo("collage");
$("m-lluvia").setAttribute("aria-pressed", modo==="lluvia");
$("m-collage").setAttribute("aria-pressed", modo==="collage");
$("btn-fotos").onclick = () => $("in-fotos").click();
$("in-fotos").onchange = e => {
  fotos = fotos.concat([...e.target.files].map(f => URL.createObjectURL(f)));
  iniciar();
};
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(iniciar, 400); });

/* ---------- Música ---------- */
const audio = new Audio(CONFIG.cancion);
audio.loop = true; audio.volume = 0.7;
function sonar(){
  audio.play().catch(() => {
    if(confirm("No encontré la canción. ¿Quieres elegir el archivo de Salvavidas desde tu dispositivo?")) $("in-audio").click();
  });
}
$("in-audio").onchange = e => { if(e.target.files[0]){ audio.src = URL.createObjectURL(e.target.files[0]); audio.play(); } };
$("cancion").onclick = () => audio.paused ? sonar() : audio.pause();
$("entrar").onclick = () => { $("entrada").classList.add("fuera"); sonar(); };

iniciar();
</script>
